# The status page pi-status writes, served on port 80 whenever the hts site
# cannot be. pi-status enables either this site or hts, never both.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/pi-status;

    location / {
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }
}
