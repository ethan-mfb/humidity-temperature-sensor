# nginx site for the hts PWA on the pi. setup-pi-hosting.sh installs it as
# /etc/nginx/sites-available/hts.
#
# Service workers only run in a secure context, so the app is served over
# https. Without it, the app loads but cannot be installed or updated.
#
# Port 80 only redirects. The web-api listens on port 3000 (see "Running the
# web-api as a service" in the root README) and is reached through this site
# under /api/, so the app and the API share one https origin: no mixed
# content and no CORS.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    ssl_certificate     /etc/ssl/hts/hts.crt;
    ssl_certificate_key /etc/ssl/hts/hts.key;

    # Each deploy unpacks into /var/www/hts/releases/<version> and then moves
    # this symlink onto it, so every file switches at once. See "Publishing
    # the hts PWA" in the root README.
    root /var/www/hts/current;
    index index.html;

    # These decide whether a client sees a new version, so they must never
    # be served from an http cache.
    location = /sw.js                { add_header Cache-Control "no-cache"; }
    location = /index.html           { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest {
        # Debian's mime.types does not know .webmanifest.
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }
    location ~ ^/workbox-.*\.js$     { add_header Cache-Control "no-cache"; }

    # Vite puts a content hash in every file name under /assets/.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The web-api's routes already start with /api/, so the path passes
    # through unchanged.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The reading stream is server-sent events: pass each event on as it
        # arrives, and keep a quiet stream open longer than nginx's default 60s.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api-docs/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
