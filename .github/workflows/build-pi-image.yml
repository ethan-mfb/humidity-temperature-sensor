name: Build Pi Image

# Manual only: a build downloads ~540MB and takes several minutes, and most
# pushes do not change the image. Run it after a change bumps image/VERSION.
on:
  workflow_dispatch:

jobs:
  build:
    # arm64 runner, so the chroot runs natively instead of under qemu.
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read image version
        id: version
        run: echo "version=$(tr -d '[:space:]' < image/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build image
        working-directory: image
        run: ./build.sh

      - name: Upload image
        uses: actions/upload-artifact@v7
        with:
          name: pi-image-v${{ steps.version.outputs.version }}
          path: |
            image/out/*.img.xz
            image/out/*.img.xz.sha256
          # Already xz-compressed; zipping it again only costs time.
          compression-level: 0
          retention-days: 14

      - name: Summarize
        run: |
          {
            echo "## Pi image v${{ steps.version.outputs.version }}"
            echo
            echo "Download the \`pi-image-v${{ steps.version.outputs.version }}\` artifact below."
            echo
            echo '```'
            cat image/out/*.img.xz.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
