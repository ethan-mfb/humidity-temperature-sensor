name: hts Tests

on:
  push:
    paths:
      - 'hts/**'
      - '.github/workflows/hts-tests.yml'
  pull_request:
    paths:
      - 'hts/**'
      - '.github/workflows/hts-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: hts

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'hts/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:once

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check code formatting
        run: npm run check-formatting

      - name: Build
        run: npm run build

      - name: Install the e2e browser
        run: npx playwright install --with-deps chromium

      - name: e2e tests
        run: npm run test:e2e
